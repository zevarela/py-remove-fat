[project]
name = "py-remove-fat"
version = "1.1.0"
description = "Identifies and removes rebuildable files in Python folders so you can save disk space and have more backups!"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "zevarela" }]
keywords = ["python", "disk-space", "venv", "cli", "uv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zevarela/py-remove-fat"
Repository = "https://github.com/zevarela/py-remove-fat"
Issues = "https://github.com/zevarela/py-remove-fat/issues"

[project.scripts]
py-remove-fat = "py_remove_fat.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.py-remove-fat]
# Shown in the CLI banner next to [project].version (update both when releasing).
release-label = "May 2026"

[tool.hatch.build.targets.wheel]
packages = ["py_remove_fat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=py_remove_fat --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["py_remove_fat"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

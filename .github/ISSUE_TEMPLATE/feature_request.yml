name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas and enhancements are welcome. Check [existing issues](https://github.com/zevarela/py-remove-fat/issues) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What pain point does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like the tool to behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, flags, or workflows you tried
    validations:
      required: false
